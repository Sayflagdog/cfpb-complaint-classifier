[project]
name = "cfpb-complaint-classifier"
version = "0.1.0"
description = "MLOps-система для автоматической классификации и анализа клиентских жалоб"
readme = "README.md"
authors = [
    { name = "kekgerman", email = "kekgerman81@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
default-groups = ["web", "dev"]